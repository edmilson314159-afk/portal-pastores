<head>

<style>
  :root{
    /* Paleta oficial Igreja Maranata: #334FC4 · #4D78FF · #D8D8D8 · #22B573 */
    --navy:#24398f; --navy-2:#334FC4; --azul-claro:#4D78FF; --gold:#22B573; --gold-soft:#e3f5ec;
    --bg:#f3f4f8; --card:#ffffff; --ink:#1c2233; --muted:#666e80; --line:#D8D8D8;
    --danger:#b3412f; --ok:#2f7a4f; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
  h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0;color:var(--navy);font-weight:700}
  button,input,textarea,select{font:inherit}
  .hidden{display:none!important}

  .entrada-logo{width:min(300px,78vw);height:auto;display:block}
  .entrada-card{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:36px 28px 28px;

  .entrada-card h1{font-size:28px;line-height:1.15}
  .entrada-card .sub{color:var(--muted);margin:6px 0 26px;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
  .campo{display:block;text-align:left;margin-bottom:14px}
  .campo span{display:block;font-size:13px;font-weight:600;color:var(--navy-2);margin-bottom:6px}
  .campo input,.campo textarea,.campo select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .campo input:focus,.campo textarea:focus,.campo select:focus{outline:2px solid var(--gold);border-color:transparent}
  .campo textarea{min-height:110px;resize:vertical}

  .btn:disabled{opacity:.6;cursor:wait}
  .btn.full{width:100%}
  .btn.gold{background:var(--gold)} .btn.gold:hover{background:#1c9a61}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}

  details.anteriores{margin-top:20px}

  .grade-logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .logo-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
  .logo-prev{height:150px;display:grid;place-items:center;padding:16px;
    background:repeating-conic-gradient(#f1efe9 0 25%,#fff 0 50%) 0 0/18px 18px}
  .logo-prev.escuro{background:var(--navy-2)}
  .logo-prev img{max-width:100%;max-height:118px;object-fit:contain}
  .logo-info{padding:12px 14px;flex:1;display:flex;flex-direction:column}
  .logo-info b{font-size:15px}
  .logo-info .acoes{margin-top:auto;padding-top:10px}
  .grupo-inst{margin:6px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--navy-2);font-weight:700}

  /* ---------- Modal ---------- */
  .fundo{position:fixed;inset:0;background:rgba(15,24,45,.55);display:grid;place-items:center;padding:16px;z-index:50}

    .papel{display:none}

    .dupla{grid-template-columns:1fr}
    .manual-atual{flex-direction:column;align-items:flex-start}

<script>
/* =============================================================
   CONFIGURAÇÃO – preencha com os dados do seu projeto Supabase.
   Deixando SUPABASE_URL vazio, o portal abre em modo demonstração.
   ============================================================= */
const CONFIG = {
  SUPABASE_URL: "https://juayaeiyvmwteqgssfhx.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_j4wJGZdJKAeNchELx-6peQ_smN2bgjP",
  CONTA_PASTORES: "pastores@portalmaranata.app" // mesmo e-mail cadastrado no Supabase
};

const DEMO = !CONFIG.SUPABASE_URL;
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MES_ABREV = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function dataBR(iso){ if(!iso) return ""; const [a,m,d] = iso.slice(0,10).split("-"); return `${d}/${m}/${a}`; }
function dataHoraBR(iso){ return new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"}); }
function extensao(nome){ const m = /\.([a-z0-9]+)$/i.exec(nome||""); return m ? m[1].toUpperCase() : "ARQ"; }
function slug(nome){ return nome.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9.]+/g,"-").toLowerCase(); }
const normalizar = t => String(t ?? "").normalize("NFC").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function destacar(texto, termos){
  const orig = String(texto ?? "").normalize("NFC"), norm = normalizar(orig);
  const marcas = [];
  termos.forEach(t => { let p = norm.indexOf(t); while(p !== -1){ marcas.push([p, p+t.length]); p = norm.indexOf(t, p+t.length); } });
  marcas.sort((a,b)=>a[0]-b[0]);
  let out = "", pos = 0;
  for(const [a,b] of marcas){ if(a < pos) continue; out += esc(orig.slice(pos,a)) + "<mark>" + esc(orig.slice(a,b)) + "</mark>"; pos = b; }
  return out + esc(orig.slice(pos));
}
function trechoCom(texto, termos){
  if(!texto) return "";
  const orig = String(texto).normalize("NFC").replace(/\s+/g," "), norm = normalizar(orig);
  let p = -1; for(const t of termos){ p = norm.indexOf(t); if(p !== -1) break; }
  if(p === -1) return "";
  const ini = Math.max(0, p - 110), fim = Math.min(orig.length, p + 170);
  return (ini > 0 ? "… " : "") + destacar(orig.slice(ini, fim), termos) + (fim < orig.length ? " …" : "");
}
function carregarScript(src){
  return new Promise((ok, falha) => {
    if(document.querySelector(`script[src="${src}"]`)) return ok();
    const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = () => falha(new Error("Falha ao carregar " + src));
    document.head.appendChild(sc);
  });
}
class ErroBiblioteca extends Error {}
async function carregarPrimeiro(bases, arquivo){
  for(const b of bases){ try{ await carregarScript(b + arquivo); return b; }catch(_){} }
  throw new ErroBiblioteca("Biblioteca de leitura indisponível");
}
// Lê o texto de um PDF ou Word (.docx) no próprio navegador, para a busca nas atas
async function extrairTexto(arquivo){
  const ext = extensao(arquivo.name).toLowerCase();
  const dados = await arquivo.arrayBuffer();
  if(ext === "pdf"){
    const base = await carregarPrimeiro([
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/",
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/"
    ], "pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({ data: dados }).promise;
    const paginas = [];
    for(let n = 1; n <= pdf.numPages; n++){
      const c = await (await pdf.getPage(n)).getTextContent();
      paginas.push(c.items.map(x => x.str).join(" "));
    }
    return paginas.join("\n\n").trim();
  }
  if(ext === "docx"){
    await carregarPrimeiro([
      "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/",
      "https://cdn.jsdelivr.net/npm/mammoth@1.6.0/"
    ], "mammoth.browser.min.js");
    const r = await mammoth.extractRawText({ arrayBuffer: dados });
    return r.value.trim();
  }
  return "";
}
function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* =============================================================
   CAMADA DE DADOS (Supabase ou demonstração)
   ============================================================= */
const api = DEMO ? criarApiDemo() : criarApiSupabase();

function criarApiSupabase(){
  const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ordem = { atas:["data_reuniao",false], informes:["criado_em",false], aniversariantes:["mes",true], agenda:["data_inicio",true], logos:["instituicao",true], manual:["criado_em",false] };

  async function papelDaSessao(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return null;
    const { data } = await sb.from("pastores_acessos").select("papel").ilike("email", session.user.email).maybeSingle();
    if(!data){ await sb.auth.signOut(); return null; }
    return data.papel;
  }
  return {
    papelDaSessao,
    async entrarPastores(senha){
      const { error } = await sb.auth.signInWithPassword({ email: CONFIG.CONTA_PASTORES, password: senha });
      if(error) throw new Error("Senha incorreta.");
      const p = await papelDaSessao(); if(!p) throw new Error("Acesso não autorizado.");
      return p;
    },
    async entrarAdmin(email, senha){
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if(error) throw new Error("E-mail ou senha incorretos.");
      const p = await papelDaSessao();
      if(p !== "admin"){ await sb.auth.signOut(); throw new Error("Este e-mail não é de um administrador."); }
      return p;
    },
    async sair(){ await sb.auth.signOut(); },
    async listar(tabela){
      const [col, asc] = ordem[tabela];
      const { data, error } = await sb.from("pastores_" + tabela).select("*").order(col, { ascending: asc, nullsFirst:false }).order("criado_em",{ascending:false});
      if(error) throw error; return data;
    },
    async inserir(tabela, linha){ const { error } = await sb.from("pastores_" + tabela).insert(linha); if(error) throw error; },
    async excluir(tabela, linha){
      if(linha.arquivo_path) await sb.storage.from("pastores").remove([linha.arquivo_path]);
      const { error } = await sb.from("pastores_" + tabela).delete().eq("id", linha.id); if(error) throw error;
    },
    async enviarArquivo(pasta, arquivo){
      const caminho = `${pasta}/${Date.now()}-${slug(arquivo.name)}`;
      const { error } = await sb.storage.from("pastores").upload(caminho, arquivo, { contentType: arquivo.type || undefined });
      if(error) throw error; return caminho;
    },
    async urlArquivo(caminho, nomeDownload){
      const opts = nomeDownload ? { download: nomeDownload } : undefined;
      const { data, error } = await sb.storage.from("pastores").createSignedUrl(caminho, 3600, opts);
      if(error) throw error; return data.signedUrl;
    }
  };
}

  const y = new Date().getFullYear(), m = new Date().getMonth()+1;
  const id = () => Math.random().toString(36).slice(2);
  const db = {

    ]
  };
  return {
    async papelDaSessao(){ return papel; },
    async entrarPastores(s){ if(s!=="maranata") throw new Error("Senha incorreta."); return papel="pastor"; },
    async entrarAdmin(e,s){ if(s!=="admin") throw new Error("E-mail ou senha incorretos."); return papel="admin"; },
    async sair(){ papel=null; },
    async listar(t){ return [...db[t]]; },
    async inserir(t,l){ db[t].unshift({id:id(),criado_em:new Date().toISOString(),...l}); },
    async excluir(t,l){ db[t] = db[t].filter(x=>x.id!==l.id); },
    async enviarArquivo(p,a){ const c=`${p}/${Date.now()}-${slug(a.name)}`; arquivos[c]=URL.createObjectURL(a); return c; },

  };
}

let PAPEL = null;
let ABA = "atas";
const cache = {};

const ABAS = [
  { id:"atas", nome:"Atas" },
  { id:"manual", nome:"Manual do Membro" },
  { id:"informes", nome:"Informes" },
  { id:"aniversariantes", nome:"Aniversariantes" },
  { id:"agenda", nome:"Agenda" },
  { id:"logos", nome:"Logos" }
];

function montarAbas(){
  $("#abas").innerHTML = ABAS.map(a => `<button class="aba ${a.id===ABA?"ativa":""}" data-aba="${a.id}">${a.nome}</button>`).join("");
}
$("#abas").addEventListener("click", e => {
  const b = e.target.closest("[data-aba]"); if(!b) return;
  ABA = b.dataset.aba; montarAbas(); carregar();
  try{ localStorage.setItem("portal_aba", ABA); }catch(_){}
});

async function abrirPortal(papel){
  PAPEL = papel;
  try{ ABA = localStorage.getItem("portal_aba") || "atas"; }catch(_){}
  if(!ABAS.some(a=>a.id===ABA)) ABA = "atas";
  $("#entrada").classList.add("hidden");
  $("#portal").classList.remove("hidden");
  $("#papelTxt").textContent = papel==="admin" ? "Administrador" : "Pastor";
  montarAbas(); carregar();
}

async function carregar(){
  const alvo = $("#conteudo");
  alvo.innerHTML = `<div class="vazio">Carregando…</div>`;
  try{
    cache[ABA] = await api.listar(ABA);
    RENDER[ABA](alvo, cache[ABA]);
  }catch(err){
    console.error(err);
    alvo.innerHTML = `<div class="vazio">Não foi possível carregar. Verifique sua conexão e tente novamente.</div>`;
  }
}

const admin = () => PAPEL === "admin";
const botaoNovo = rotulo => admin() ? `<button class="btn gold small" data-novo>+ ${rotulo}</button>` : "";
const botaoExcluir = idx => admin() ? `<button class="btn danger small" data-excluir="${idx}">Excluir</button>` : "";

/* ---------------- ações nos cards ---------------- */
$("#conteudo").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  const itens = cache[ABA] || [];
  if(b.hasAttribute("data-novo")) return abrirFormulario(ABA);
  if(b.dataset.abrir !== undefined || b.dataset.baixar !== undefined){
    const it = itens[+(b.dataset.abrir ?? b.dataset.baixar)];
    const baixar = b.dataset.baixar !== undefined;
    const janela = baixar ? null : window.open("about:blank","_blank");
    try{
      const url = await api.urlArquivo(it.arquivo_path, baixar ? (it.arquivo_nome || "arquivo") : null);
      if(janela){ janela.location = url; }
      else { const a = document.createElement("a"); a.href = url; a.download = it.arquivo_nome || ""; document.body.appendChild(a); a.click(); a.remove(); }
    }catch(err){ janela?.close(); toast("Não foi possível abrir o arquivo."); }
    return;
  }
  if(b.dataset.excluir !== undefined){
    const it = itens[+b.dataset.excluir];
    if(!confirm(`Excluir "${it.titulo || it.nome}"? Essa ação não pode ser desfeita.`)) return;
    b.disabled = true;
    try{ await api.excluir(ABA, it); toast("Excluído."); carregar(); }
    catch(err){ b.disabled = false; toast("Não foi possível excluir."); }
  }
});

function campoHTML(c){
  if(c.dupla) return `<div class="dupla">${c.dupla.map(campoHTML).join("")}</div>`;
  const req = c.obrig ? "required" : "";
  let input;
  if(c.t==="textarea") input = `<textarea name="${c.n}" ${req}></textarea>`;
  else if(c.t==="select") input = `<select name="${c.n}" ${req}><option value="">Selecione</option>${c.op.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select>`;
  else input = `<input name="${c.n}" type="${c.t}" ${req} ${c.ph?`placeholder="${esc(c.ph)}"`:""} ${c.valor?`value="${esc(c.valor)}"`:""} ${c.accept?`accept="${c.accept}"`:""} ${c.min?`min="${c.min}"`:""} ${c.max?`max="${c.max}"`:""} ${c.lista?`list="lista-${c.n}"`:""}>
    ${c.lista?`<datalist id="lista-${c.n}">${c.lista.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`;
  return `<label class="campo"><span>${c.r}</span>${input}</label>`;
}

function abrirFormulario(aba){
  const f = FORMS[aba];
  $("#modalRaiz").innerHTML = `
    <div class="fundo"><form class="modal" id="formNovo">
      <h2>${f.titulo}</h2>
      ${f.campos.map(campoHTML).join("")}
      <div class="erro" id="erroForm"></div>
      <div class="rodape">
        <button type="button" class="btn ghost" id="cancelar">Cancelar</button>
        <button type="submit" class="btn">Publicar</button>
      </div>
    </form></div>`;
  const fechar = () => $("#modalRaiz").innerHTML = "";
  $("#cancelar").onclick = fechar;
  $(".fundo").addEventListener("click", e => { if(e.target.classList.contains("fundo")) fechar(); });
  $("#formNovo [name]")?.focus();

  $("#formNovo").onsubmit = async e => {
    e.preventDefault();
    const form = e.target, enviar = form.querySelector("[type=submit]");
    const dados = Object.fromEntries(new FormData(form));
    const arquivo = form.querySelector("input[type=file]")?.files[0];
    delete dados.arquivo;
    for(const k in dados){ if(dados[k]==="") dados[k] = null; }
    if(aba==="aniversariantes"){ dados.dia = +dados.dia; dados.mes = +dados.mes; }
    if(aba==="agenda" && dados.data_fim && dados.data_fim < dados.data_inicio){ $("#erroForm").textContent = "A data de término não pode ser antes do início."; return; }
    const ext = arquivo ? extensao(arquivo.name).toLowerCase() : "";
    if(aba==="atas" && !["pdf","docx"].includes(ext)){
      $("#erroForm").textContent = ext==="doc"
        ? "Arquivos .doc antigos não são aceitos. Abra no Word e salve como .docx ou PDF."
        : "A ata precisa ser um arquivo PDF ou Word (.docx). Fotos não são aceitas.";
      return;
    }
    if(aba==="manual" && ext !== "pdf"){ $("#erroForm").textContent = "O Manual do Membro precisa ser um arquivo PDF."; return; }
    enviar.disabled = true;
    try{
      if(aba==="atas"){
        enviar.textContent = "Lendo o texto da ata…";
        let texto = "";
        try{ texto = await extrairTexto(arquivo); }
        catch(err){
          console.error(err);
          if(err instanceof ErroBiblioteca){
            $("#erroForm").textContent = "Não foi possível carregar o leitor de documentos. Verifique a internet e tente novamente.";
            enviar.disabled = false; enviar.textContent = "Publicar"; return;
          }
        }
        if(texto.replace(/\s/g,"").length < 40){
          $("#erroForm").textContent = ext==="pdf"
            ? "Não foi possível ler texto neste PDF. Ele parece ser uma foto ou digitalização. Envie o PDF gerado no computador ou o arquivo Word."
            : "Não foi possível ler o texto deste arquivo. Verifique se o documento não está vazio.";
          enviar.disabled = false; enviar.textContent = "Publicar"; return;
        }
        dados.texto = texto.normalize("NFC");
      }
      enviar.textContent = arquivo ? "Enviando arquivo…" : "Publicando…";
      if(arquivo){
        dados.arquivo_path = await api.enviarArquivo(f.pasta, arquivo);
        dados.arquivo_nome = arquivo.name;
      }
      await api.inserir(aba, dados);
      fechar(); toast("Publicado!"); carregar();
    }catch(err){
      console.error(err);
      $("#erroForm").textContent = "Não foi possível publicar. Tente novamente.";
      enviar.disabled = false; enviar.textContent = "Publicar";
    }
  };
}

   ENTRADA
   ============================================================= */
if(DEMO) $("#avisoDemo").classList.remove("hidden");

$("#irAdmin").onclick = () => { $("#formSenha").classList.add("hidden"); $("#formAdmin").classList.remove("hidden"); $("#adminEmail").focus(); };
$("#voltarSenha").onclick = () => { $("#formAdmin").classList.add("hidden"); $("#formSenha").classList.remove("hidden"); $("#senha").focus(); };

async function tentar(form, erroSel, fn){
  const b = form.querySelector("[type=submit]"); b.disabled = true; $(erroSel).textContent = "";
  try{ abrirPortal(await fn()); form.reset(); }
  catch(err){ $(erroSel).textContent = err.message || "Não foi possível entrar."; }
  finally{ b.disabled = false; }
}
$("#formSenha").onsubmit = e => { e.preventDefault(); tentar(e.target, "#erroSenha", () => api.entrarPastores($("#senha").value)); };
$("#formAdmin").onsubmit = e => { e.preventDefault(); tentar(e.target, "#erroAdmin", () => api.entrarAdmin($("#adminEmail").value.trim(), $("#adminSenha").value)); };

$("#sair").onclick = async () => {
  await api.sair(); PAPEL = null;
  $("#portal").classList.add("hidden"); $("#entrada").classList.remove("hidden");
  $("#modalRaiz").innerHTML = "";
};

// Mantém a pessoa conectada ao reabrir o portal
api.papelDaSessao().then(p => { if(p) abrirPortal(p); }).catch(()=>{});
